<?xml version="1.0" encoding="utf-8"?>
<!--
  Release-configuration launcher config for TungstenMonoxide. Copied by
  cpp/launcher/CMakeLists.txt's post-build step to "TungstenMonoxide.cfg" beside
  Launcher.exe.

  Paths below are relative to Launcher.exe's own directory (cpp/build/launcher/Release/,
  from the documented `cmake -S cpp -B cpp/build` layout), matching how the
  TungstenMonoxide/Willpower runtime DLLs are copied to sit right beside it.
-->
<Configuration>
    <Video>
        <Width>1600</Width>
        <Height>900</Height>
        <Fullscreen>false</Fullscreen>
        <VSync>true</VSync>
    </Video>
    <Game>
        <DLL path="TungstenMonoxide.dll"/>
        <GameResource>TungstenMonoxide</GameResource>
        <ResourceLocations>
            <ResourceLocation type="Directory" path="../../../tungsten-monoxide/resources/" definition="Resources.xml"/>
        </ResourceLocations>
        <Debug>
            <!-- mpp::RenderSystem's own built-in FPS/memory overlay stays hidden (Window.cpp's
                 mDisplayDebugEnabled -> Main.cpp's showDebugPanel). Unrelated to the F1-toggled
                 game debug window (StatePlayTungstenMonoxide::mShowDebugUi), which F1 always
                 controls regardless of this setting. -->
            <InGame>disabled</InGame>
        </Debug>
        <Arguments>
            <!-- ThreadedLoading remains at DLL.cpp's true default. The PBR package is initialized
                 on the render thread by Controller before threaded MapLoad starts. -->
            <Argument name="PbrPackage">../../../tungsten-monoxide/resources/TungstenMonoxide.mpppackage</Argument>
        </Arguments>
    </Game>
    <Audio>
        <Enabled>true</Enabled>
        <Channels>1024</Channels>
        <!-- Asynchronous FMOD updates: runs on its own thread instead of blocking the frame. -->
        <Sync>false</Sync>
    </Audio>
</Configuration>
