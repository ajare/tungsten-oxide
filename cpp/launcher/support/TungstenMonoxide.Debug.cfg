<?xml version="1.0" encoding="utf-8"?>
<!--
  Debug-configuration launcher config for TungstenMonoxide. Copied by
  cpp/launcher/CMakeLists.txt's post-build step to "TungstenMonoxide.cfg" beside
  Launcher.exe -- see cpp/launcher/CMakeLists.txt's VS_DEBUGGER_COMMAND_ARGUMENTS,
  which passes that exact filename when debugging the Debug configuration from
  Visual Studio.

  Paths below are relative to Launcher.exe's own directory (cpp/build/launcher/Debug/,
  from the documented `cmake -S cpp -B cpp/build` layout), matching how the
  TungstenMonoxide/Willpower runtime DLLs are copied to sit right beside it.
-->
<Configuration>
    <Video>
        <Width>1600</Width>
        <Height>900</Height>
        <Fullscreen>false</Fullscreen>
        <VSync>true</VSync>
    </Video>
    <Game>
        <DLL path="TungstenMonoxide.dll"/>
        <GameResource>TungstenMonoxide</GameResource>
        <ResourceLocations>
            <ResourceLocation type="Directory" path="../../../tungsten-monoxide/resources/" definition="Resources.xml"/>
        </ResourceLocations>
        <Debug>
            <!-- Shows mpp::RenderSystem's own built-in FPS/memory overlay (Window.cpp's
                 mDisplayDebugEnabled -> Main.cpp's showDebugPanel). Unrelated to the F1-toggled
                 game debug window (StatePlayTungstenMonoxide::mShowDebugUi), which F1 always
                 controls regardless of this setting. -->
            <InGame>enabled</InGame>
        </Debug>
        <Arguments>
            <!-- Single-threaded map loading, easier to step through in a debugger (DLL.cpp's
                 gThreadedLoading, otherwise true by default). -->
            <Argument name="ThreadedLoading">false</Argument>
        </Arguments>
    </Game>
    <Audio>
        <Enabled>true</Enabled>
        <Channels>1024</Channels>
        <!-- Synchronous FMOD updates: no background audio thread to race with a paused debugger. -->
        <Sync>true</Sync>
    </Audio>
</Configuration>
