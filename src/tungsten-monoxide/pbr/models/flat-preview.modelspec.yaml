ModelSpecification:
  MeshSpecification:
    primitive: "triangles"
    indexed: "false"
    storage: "static"
    Buffer:
      - data: "position3"
        type: "float32"
      - data: "normal3"
        type: "float32"
      - data: "texcoord2"
        type: "float32"
      - data: "colour4"
        type: "uint8"
        normalised: "true"
      - data: "tangent4"
        type: "float32"
  Materials:
    PbrMaterial:
      name: "Preview.Material"
      Surface:
        baseColourFactor: "1 1 1 1"
        metallicFactor: "0"
        roughnessFactor: "0.7"
        emissiveFactor: "0 0 0"
        normalScale: "1"
        occlusionStrength: "1"
        alphaMode: "OPAQUE"
        alphaCutoff: "0.5"
        doubleSided: "false"
