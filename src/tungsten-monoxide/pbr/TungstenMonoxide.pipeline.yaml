PbrPipeline:
  version: "1"
  name: "TungstenMonoxide.Pbr"
  PreviewScene:
    file: "TungstenMonoxidePreview.scene.yaml"
  LocalResources:
    PbrMaterial:
      - name: "Ship.Surface"
        MeshSpecification:
          primitive: "triangles"
          indexed: "true"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "1 1 1 1"
          metallicFactor: "0.15"
          roughnessFactor: "0.55"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
        BaseColourMap:
          Resource:
            name: "Ship.Surface.BaseColour"
            target: "2D"
            filename: "textures/ship.png"
            colourSpace: "SRGB"
            mipmaps: "true"
            minFilter: "LINEAR_MIPMAP_LINEAR"
            magFilter: "LINEAR"
            wrap: "REPEAT"
      - name: "Track.Asphalt"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "1 1 1 1"
          metallicFactor: "0.0"
          roughnessFactor: "0.78"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
        BaseColourMap:
          Resource:
            name: "Track.Asphalt.BaseColour"
            target: "2D"
            filename: "textures/asphalt.png"
            colourSpace: "SRGB"
            mipmaps: "true"
            minFilter: "LINEAR_MIPMAP_LINEAR"
            magFilter: "LINEAR"
            wrap: "REPEAT"
      - name: "Track.Rail"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "1 1 1 1"
          metallicFactor: "0.25"
          roughnessFactor: "0.48"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
        BaseColourMap:
          Resource:
            name: "Track.Rail.BaseColour"
            target: "2D"
            filename: "textures/rail.png"
            colourSpace: "SRGB"
            mipmaps: "true"
            minFilter: "LINEAR_MIPMAP_LINEAR"
            magFilter: "LINEAR"
            wrap: "REPEAT"
      - name: "Track.Mesh"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "1 1 1 1"
          metallicFactor: "0.0"
          roughnessFactor: "0.72"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
        BaseColourMap:
          Resource:
            name: "Track.Mesh.BaseColour"
            target: "2D"
            filename: "textures/mesh.png"
            colourSpace: "SRGB"
            mipmaps: "true"
            minFilter: "LINEAR_MIPMAP_LINEAR"
            magFilter: "LINEAR"
            wrap: "REPEAT"
      - name: "Track.Shell"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "0.8 0.82 0.85 1"
          metallicFactor: "0.65"
          roughnessFactor: "0.42"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
        BaseColourMap:
          Resource:
            name: "Track.Shell.BaseColour"
            target: "2D"
            filename: "textures/shell.png"
            colourSpace: "SRGB"
            mipmaps: "true"
            minFilter: "LINEAR_MIPMAP_LINEAR"
            magFilter: "LINEAR"
            wrap: "REPEAT"
      - name: "Track.Zone"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "0.15 0.35 1 1"
          metallicFactor: "0.0"
          roughnessFactor: "0.65"
          emissiveFactor: "0.02 0.08 0.35"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
      - name: "Track.Trigger"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "1 0.1 0.8 1"
          metallicFactor: "0.0"
          roughnessFactor: "0.7"
          emissiveFactor: "0.8 0.02 0.5"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
      - name: "Track.Fallback"
        MeshSpecification:
          primitive: "triangles"
          indexed: "false"
          storage: "static"
          Buffer:
            - data: "position3"
              type: "float32"
            - data: "normal3"
              type: "float32"
            - data: "texcoord2"
              type: "float32"
            - data: "colour4"
              type: "uint8"
              normalised: "true"
            - data: "tangent4"
              type: "float32"
        Surface:
          baseColourFactor: "0.8 0.8 0.8 1"
          metallicFactor: "0.0"
          roughnessFactor: "0.8"
          emissiveFactor: "0 0 0"
          normalScale: "1"
          occlusionStrength: "1"
          alphaMode: "OPAQUE"
          alphaCutoff: "0.5"
          doubleSided: "false"
    PostEffectMaterial:
      name: "PostEffect.ToneMap"
      Program:
        Ref: "__mpp_p2d_tonemap__"
      SamplerSlots:
        - "TEX1"
      Uniforms:
        - name: "EXPOSURE"
          type: "float"
          value: "1"
        - name: "TONE_MAP_OPERATOR"
          type: "int"
          value: "1"
  Imports:
    - id: "shadowDepth"
      semantic: "shadowDepth"
      format: "DEPTH24"
      usage: "depthAttachment,sampled"
      required: "true"
    - id: "screen"
      semantic: "presentation"
      format: "RGBA8"
      usage: "colourAttachment,presentation"
      required: "true"
  Outputs:
    - name: "Main"
      image: "Presentation"
      taaDepth: "SceneDepth"
      AntiAliasing:
        msaa: "off"
        ssaa: "off"
        taa: "false"
        fxaa: "false"
  Environment:
    binding: "TungstenMonoxide.Environment"
  Bloom:
    enabled: "false"
    blurPasses: "0"
  PreviewBindings:
    - binding: "Ship.Surface"
      resource: "Ship.Surface"
    - binding: "Track.Asphalt"
      resource: "Track.Asphalt"
    - binding: "Track.Rail"
      resource: "Track.Rail"
    - binding: "Track.Mesh"
      resource: "Track.Mesh"
    - binding: "Track.Shell"
      resource: "Track.Shell"
    - binding: "Track.Zone"
      resource: "Track.Zone"
    - binding: "Track.Trigger"
      resource: "Track.Trigger"
    - binding: "Track.Fallback"
      resource: "Track.Fallback"
  RenderGraph:
    Images:
      - name: "ShadowDepth"
        format: "DEPTH24"
        usage: "depthAttachment,sampled"
        depthCompare: "true"
        import: "shadowDepth"
        external: "true"
        transient: "false"
      - name: "SceneHdr"
        format: "RGBA16F"
        usage: "colourAttachment,sampled"
        colourSpace: "LINEAR"
        minFilter: "LINEAR"
        magFilter: "LINEAR"
        wrap: "CLAMP_TO_EDGE"
      - name: "SceneDepth"
        format: "DEPTH24"
        usage: "depthAttachment,sampled"
      - name: "Presentation"
        format: "RGBA8"
        usage: "sampled,colourAttachment,presentation"
        import: "screen"
        external: "true"
        transient: "false"
    Passes:
      - name: "ShadowDepth"
        type: "scene"
        factory: "MPP.ShadowDepth"
        Depth:
          image: "ShadowDepth"
          load: "clear"
          store: "store"
          clear: "1"
      - name: "PbrScene"
        type: "scene"
        factory: "MPP.PbrScene"
        Inputs:
          - sampler: "SHADOW_MAP"
            image: "ShadowDepth"
        Colours:
          - image: "SceneHdr"
            load: "clear"
            store: "store"
            clear: "0.008 0.012 0.02 1"
        Depth:
          image: "SceneDepth"
          load: "clear"
          store: "store"
          clear: "1"
      - name: "ToneMapPresentation"
        type: "present"
        factory: "MPP.FullscreenEffect"
        program: "PostEffect.ToneMap"
        Inputs:
          - sampler: "TEX1"
            image: "SceneHdr"
        Colours:
          - image: "Presentation"
            load: "clear"
            store: "store"
            clear: "0 0 0 1"
